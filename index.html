<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Exploit Launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
    background-color: #0c0c0f;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 15vh;
    margin: 0;
    user-select: none;
    -webkit-user-select: none;
}
.btn {
    display: inline-block;
    padding: 20px 40px;
    cursor: pointer;
    background-color: #202125;
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    border-radius: 12px;
    text-decoration: none;
    border: 2px solid #333;
}
.btn:active {
    background-color: #444;
}
.btn.disabled {
    opacity: 0.4;
    pointer-events: none;
}
#msg {
    color: #888;
    font-size: 14px;
    margin-top: 20px;
}
</style>
</head>
<body>

<div>
    <a href="#" class="btn disabled" id="run">RUN</a>
</div>
<div id="msg">Offsets yükleniyor...</div>

<script>
"use strict";
const EXPLOIT_URL = "notify.html";
// Dosyalar aynı klasörde olduğu için doğrudan dosya adını yazıyoruz
const OFFSETS_URL = "offsets.json";

const run = document.getElementById("run");
const msg = document.getElementById("msg");

const m = /PlayStation 4[\/\s]?(\d+)[.,](\d+)/.exec(navigator.userAgent);
const fw = m ? `${m[1].padStart(2, "0")}.${m[2].padStart(2, "0")}` : null;

let entry = null;

function fwNum(s) {
    const p = s.split(".");
    return parseInt(p[0], 10) * 100 + parseInt(p[1], 10);
}

function nearest(data, target) {
    const want = fwNum(target);
    const maj = target.split(".")[0];
    let best = null, bestd = 1e9;
    for (const k in data) {
        if (k.split(".")[0] !== maj) continue;
        const d = Math.abs(fwNum(k) - want);
        if (d < bestd) { bestd = d; best = k; }
    }
    return best;
}

fetch(OFFSETS_URL, { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
        if (!fw) { msg.textContent = "PS4 algılanamadı, UA uyuşmadı 😭"; return; }
        entry = data[fw];
        if (entry) {
            run.classList.remove("disabled");
            msg.textContent = `Firmware ${fw} - Hazır!`;
            return;
        }
        const near = nearest(data, fw);
        if (near) {
            entry = data[near];
            msg.textContent = `${fw}: exact offset yok, ${near} deneniyor`;
            run.classList.remove("disabled");
        } else {
            msg.textContent = `Firmware ${fw} desteklenmiyor 💀`;
        }
    })
    .catch(function () {
        msg.textContent = "offsets.json yüklenemedi, GitHub yolunu kontrol et!";
    });

run.addEventListener("click", function (e) {
    e.preventDefault();
    if (!entry) return;
    const q = new URLSearchParams();
    q.set("go", "1");
    q.set("fw", fw);
    q.set("hc", entry.hc.join(","));
    q.set("gd", entry.gd);
    q.set("notify", entry.nt);
    q.set("gps", entry.gps);
    q.set("gpe", entry.gpe);
    q.set("cls", entry.cls);
    q.set("cle", entry.cle);
    q.set("ers", entry.ers);
    q.set("ere", entry.ere);
    location.href = `${EXPLOIT_URL}?${q.toString()}`;
});
</script>
</body>
</html>
