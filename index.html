<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PS4 Harici JS Exploit Çalıştırıcı</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 40px;
        }
        h1 { color: #ff3333; text-shadow: 0 0 10px rgba(255, 51, 51, 0.5); }
        #log {
            background-color: #000000;
            border: 2px solid #ff3333;
            width: 85%;
            margin: 20px auto;
            padding: 20px;
            text-align: left;
            height: 500px;
            overflow-y: scroll;
            color: #00ff66;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        button {
            padding: 18px 45px;
            font-size: 20px;
            cursor: pointer;
            background-color: #ff3333;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
            transition: 0.2s;
        }
        button:hover { background-color: #ff5555; }
    </style>
</head>
<body>
    <h1>PS4 ps4_full_exploit_chain.js Çalıştırıcısı 💀</h1>
    <p>Dosya doğrudan harici olarak çağrılıyor, bu iş baya bela 👉👈🥺.</p>
    <button onclick="triggerChain()">ps4_full_exploit_chain.js'yi Başlat</button>
    <div id="log"></div>

    <script>
        // Konsol loglarını ekrandaki siyah kutuya ve tarayıcıya yansıtma
        const logBox = document.getElementById('log');
        const originalLog = console.log;
        const originalError = console.error;

        function appendLog(message, isError = false) {
            const color = isError ? '#ff5555' : '#00ff66';
            logBox.innerHTML += `<span style="color: ${color}">${message}</span><br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        console.log = function(msg) {
            originalLog.apply(console, arguments);
            appendLog(msg, false);
        };

        console.error = function(msg) {
            originalError.apply(console, arguments);
            appendLog(msg, true);
        };

        // Harici dosyadan gelen ana fonksiyonu tetikleyen köprü
        function triggerChain() {
            if (typeof initializeExploitChain === 'function') {
                console.log("[*] Harici ps4_full_exploit_chain.js tetikleniyor...");
                initializeExploitChain();
            } else {
                console.error("[-] Hata: initializeExploitChain fonksiyonu bulunamadı! ps4_full_exploit_chain.js yüklenemedi mi?");
            }
        }
    </script>

    <!-- Doğrudan senin istediğin harici JavaScript dosyası -->
    <script src="ps4_full_exploit_chain.js"></script>
</body>
</html>
