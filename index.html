<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PS4 Offset & JSON Parser</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #e6edf3;
            font-family: monospace;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 1.2rem;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .pane {
            flex: 1;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
        }
        textarea {
            width: 100%;
            height: 400px;
            background: #0d1117;
            color: #7ee787;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #2ea043;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.8rem;
        }
        th, td {
            border: 1px solid #30363d;
            padding: 6px 8px;
            text-align: left;
        }
        th {
            background: #21262d;
            color: #c9d1d9;
        }
        .table-container {
            max-height: 410px;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 4px;
        }
        .error {
            color: #f85149;
            margin-top: 10px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <h1>PS4 Gerçek Zamanlı JSON Offset Ayrıştırıcı</h1>
    <p style="font-size: 0.85rem; color: #8b949e;">Bu araç, simülasyon içermez; sol taraftaki JSON verisini doğrudan tarayıcı belleğinde parse ederek tabloya döker.</p>

    <div class="container">
        <div class="pane">
            <h3>JSON Veri Girişi</h3>
            <textarea id="json-input">{
  "13.52": {
    "XFAST_SYSCALL_addr": "0x000001C0",
    "PRISON0_addr": "0x0111FA18",
    "ROOTVNODE_addr": "0x02136E90",
    "M_TEMP_addr": "0x01520D00",
    "ALLPROC_addr": "0x01B28538",
    "enable_fpkg_patch": "0x003DE07F",
    "app_installer_patch": "0x001389A0",
    "ext_hdd_patch": "0x0061465D",
    "debug_trophies_patch": "0x0074D5E9",
    "proc_p_comm_offset": "0x454",
    "proc_path_offset": "0x474"
  }
}</textarea>
            <button onclick="parseJSONData()">JSON'u Ayrıştır ve Tabloya Aktar</button>
            <div id="error-msg" class="error"></div>
        </div>

        <div class="pane">
            <h3>Offset Tablosu Çıktısı</h3>
            <div class="table-container">
                <table id="output-table">
                    <thead>
                        <tr>
                            <th>Sürüm / Anahtar</th>
                            <th>Sembol / Parametre</th>
                            <th>Adres (Hex)</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="3" style="text-align: center; color: #8b949e;">Veri bekleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function parseJSONData() {
            const rawText = document.getElementById('json-input').value;
            const errorDiv = document.getElementById('error-msg');
            const tbody = document.getElementById('table-body');
            
            errorDiv.textContent = "";
            tbody.innerHTML = "";

            try {
                const parsed = JSON.parse(rawText);
                let rowCount = 0;

                for (let version in parsed) {
                    const entries = parsed[version];
                    for (let key in entries) {
                        rowCount++;
                        const tr = document.createElement('tr');
                        
                        const tdVer = document.createElement('td');
                        tdVer.textContent = version;
                        
                        const tdKey = document.createElement('td');
                        tdKey.textContent = key;
                        
                        const tdVal = document.createElement('td');
                        tdVal.textContent = entries[key];
                        tdVal.style.color = '#7ee787';

                        tr.appendChild(tdVer);
                        tr.appendChild(tdKey);
                        tr.appendChild(tdVal);
                        tbody.appendChild(tr);
                    }
                }

                if (rowCount === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #f85149;">JSON içinde geçerli offset verisi bulunamadı.</td></tr>';
                }
            } catch (e) {
                errorDiv.textContent = "Geçersiz JSON formatı: " + e.message;
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #f85149;">Ayrıştırma hatası!</td></tr>';
            }
        }

        // Sayfa ilk açıldığında otomatik parse etsin
        parseJSONData();
    </script>
</body>
</html>
